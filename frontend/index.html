<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoCycle — Sustainable Urban Mobility</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <style>
      /* Fix Leaflet z-index conflicts */
      .leaflet-pane        { z-index: 400 !important; }
      .leaflet-top,
      .leaflet-bottom      { z-index: 999 !important; }
      /* Spinner used in LiveMap */
      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner { animation: spin 0.8s linear infinite; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Leaflet JS — MUST load before React so window.L is ready -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WPsE="
      crossorigin=""
    ></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
